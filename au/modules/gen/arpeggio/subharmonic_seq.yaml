id: gen.arpeggio.subharmonic_seq
version: 1.0.0
level: 2
category: generator
family: synth
display_name: "Subharmonic Pulse Sequencer"
summary: "Subharmonic Pulse Sequencer L2 Synthesizer Voice."

guarantees:
  band_hz: [40.0, 16000.0]

suggested_roles: ['arpeggiator', 'subharmonic_pulse', 'foundation']

ports:
  in:
    - {name: pitch, type: ctrl, unit: midinote, required: true}
  out:
    - {name: out, type: audio, channels: 2}
    - {name: env_follow, type: analysis}

macros:
  brightness:
    maps:
      param_main: {from: 0.2, to: 8.0}
  body:
    maps:
      param_main: {from: 0.1, to: 5.0}
  noise_ratio:
    maps:
      param_main: {from: 0.0, to: 1.0}
  motion:
    maps:
      param_main: {from: 0.1, to: 2.0}
  material:
    maps:
      param_main: {from: 0.5, to: 3.0}

params:
  param_main:
    min: 0.0
    max: 10.0
    default: 1.0

id: gen.drone.sub_bass
version: 1.0.0
level: 2
category: generator
family: sub_bass
display_name: "Sub-Bass-Fundament"
summary: >
  Tiefes, kraftvolles Bass-Fundament mit steuerbarer Saettigung und Obertonelektronik.
  Traegt als vollstaendige L2-Stimme den kanonischen Makrosatz.

guarantees:
  band_hz: [20.0, 450.0]

ports:
  in:
    - {name: pitch, type: ctrl, unit: midinote, required: true}
    - {name: excitation, type: audio}
  out:
    - {name: out, type: audio, channels: 2}
    - {name: env_follow, type: analysis}

macros:
  brightness:
    maps:
      drive:    {from: 0.05, to: 0.85}
      sub_cutoff: {from: 100.0, to: 1200.0}
    curve: exp
    default: 0.3
  body:
    maps:
      sub_gain: {from: 0.2, to: 1.0}
      bass_boost: {from: 0.0, to: 0.8}
    curve: lin
    default: 0.6
  noise_ratio:
    maps:
      rumble_mix: {from: 0.0, to: 0.4}
    curve: exp
    default: 0.05
  motion:
    maps:
      lfo_rate: {from: 0.01, to: 0.5}
      wobble_depth: {from: 0.0, to: 0.25}
    curve: log
    default: 0.15
  material:
    maps:
      saturation_type: {from: 0.0, to: 4.0}
    curve: step
    default: 0.0

params:
  saturation_type:
    enum: [warm, tube, tape, hard, clean]
    default: warm
  sub_gain:
    min: 0.1
    max: 1.0
    default: 0.7
  sub_cutoff:
    min: 60.0
    max: 2000.0
    default: 400.0
  drive:
    min: 0.0
    max: 1.0
    default: 0.2
  rumble_mix:
    min: 0.0
    max: 0.5
    default: 0.05
  lfo_rate:
    min: 0.01
    max: 2.0
    default: 0.1
  wobble_depth:
    min: 0.0
    max: 0.5
    default: 0.1
  bass_boost:
    min: 0.0
    max: 1.0
    default: 0.5

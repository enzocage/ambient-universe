id: gen.noise.stochastic_trigger
version: 1.0.0
level: 2
category: generator
family: stochastic_synthesis
display_name: "Stochastic Dust & Resonance Generator"
summary: >
  Stochastischer Dust- & Resonanz-Generator fuer organisches Knistern.

guarantees:
  band_hz: [40.0, 16000.0]

ports:
  in:
    - {name: pitch, type: ctrl, unit: midinote, required: true}
    - {name: excitation, type: audio}
  out:
    - {name: out, type: audio, channels: 2}
    - {name: env_follow, type: analysis}

macros:
  brightness:
    maps:
      resonance_freq: {from: 400.0, to: 8000.0}
    default: 0.5
  body:
    maps:
      resonance_freq: {from: 200.0, to: 3000.0}
    default: 0.4
  noise_ratio:
    maps:
      crackle_mix: {from: 0.0, to: 0.8}
    default: 0.2
  motion:
    maps:
      density_hz: {from: 1.0, to: 45.0}
    default: 0.3
  material:
    maps:
      resonance_freq: {from: 500.0, to: 5000.0}
    default: 0.4

params:
  density_hz:
    min: 0.5
    max: 100.0
    default: 12.0
  resonance_freq:
    min: 100.0
    max: 10000.0
    default: 2400.0
  crackle_mix:
    min: 0.0
    max: 1.0
    default: 0.2

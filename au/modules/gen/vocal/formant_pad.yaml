id: gen.vocal.formant_pad
version: 1.0.0
level: 2
category: generator
family: formant_synthesis
display_name: "Choral Formant Vowel Pad"
summary: >
  Formantsynthese-Flächenstimme mit Vokal-Resonanzen.

guarantees:
  band_hz: [80.0, 14000.0]

ports:
  in:
    - {name: pitch, type: ctrl, unit: midinote, required: true}
    - {name: excitation, type: audio}
  out:
    - {name: out, type: audio, channels: 2}
    - {name: env_follow, type: analysis}

macros:
  brightness:
    maps:
      formant_shift: {from: 0.7, to: 1.6}
    default: 0.5
  body:
    maps:
      formant_shift: {from: 0.8, to: 1.2}
    default: 0.6
  noise_ratio:
    maps:
      breath_mix: {from: 0.0, to: 0.4}
    default: 0.2
  motion:
    maps:
      formant_shift: {from: 0.9, to: 1.4}
    default: 0.12
  material:
    maps:
      formant_shift: {from: 0.8, to: 1.5}
    default: 0.5

params:
  formant_shift:
    min: 0.5
    max: 2.0
    default: 1.0
  breath_mix:
    min: 0.0
    max: 0.5
    default: 0.08

id: prc.util.softclip
version: 1.0.0
level: 1
category: processor
family: util
display_name: "Weiche Begrenzung"
summary: >
  Begrenzt die Amplitude ohne harte Kanten. Pflichtbestandteil jeder
  Rueckkopplungsschleife und letzte Instanz vor jedem Modulausgang.

ports:
  in:
    - {name: in, type: audio, required: true}
  out:
    - {name: out, type: audio}

params:
  ceiling:
    min: 0.05
    max: 1.0
    default: 0.5
    curve: exp
    smooth_ms: 50.0
    summary: "Zielamplitude, ab der die Kennlinie kruemmt."
  hardness:
    min: 0.0
    max: 1.0
    default: 0.3
    smooth_ms: 100.0
    summary: "0 = sehr weich (tanh-artig), 1 = knapp unter hartem Clipping."

guarantees:
  band_hz: [20.0, 20000.0]
  peak_ceiling_dbfs: -6.0
  dc_free: true
  latency_samples: 0
  deterministic: true

cost:
  cpu_units: 0.3
  voices_max: 64

tags: [util, safety, feedback-guard, saturation]
semantic_vectors: {warmth: 0.6, brightness: 0.45, organic: 0.4, density: 0.0}

license:
  backend: supercollider
  nc_weights: false

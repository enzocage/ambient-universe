id: mod.rand.brownian_smooth
version: 1.0.0
level: 1
category: modulator
family: random
display_name: "Geglaetteter Random Walk"
summary: >
  Brownsche Bewegung mit Glaettung und Rueckstellkraft. Erzeugt organische
  Parameterwanderungen, die nie ausbrechen und nie stehenbleiben — das
  Gegenmittel gegen statische Drones.

ports:
  in:
    - {name: rate, type: ctrl, unit: hz}
  out:
    - {name: out, type: ctrl}

params:
  rate_hz:
    min: 0.0005
    max: 5.0
    default: 0.05
    unit: hz
    curve: exp
    smooth_ms: 1000.0
    summary: "Wie oft ein neuer Schritt gezogen wird."
  step:
    min: 0.001
    max: 0.5
    default: 0.05
    curve: exp
    smooth_ms: 500.0
    summary: "Schrittweite je Ziehung."
  centering:
    min: 0.0
    max: 1.0
    default: 0.15
    smooth_ms: 800.0
    summary: "Rueckstellkraft zur Mitte. 0 driftet frei, 1 haelt fest."
  smooth_ms:
    min: 10.0
    max: 20000.0
    default: 2000.0
    unit: ms
    curve: exp
    smooth_ms: 0.0
  seed:
    min: 0.0
    max: 2147483647.0
    default: 0.0
    curve: step
    smooth_ms: 0.0
    summary: "0 = aus der Seed-Hierarchie beziehen."

guarantees:
  band_hz: [20.0, 20000.0]
  peak_ceiling_dbfs: -6.0
  dc_free: false
  latency_samples: 0
  deterministic: true

cost:
  cpu_units: 0.2
  voices_max: 64

tags: [modulator, random, organic, drift, motion]
semantic_vectors: {warmth: 0.5, brightness: 0.5, organic: 0.9, density: 0.0}

license:
  backend: supercollider
  nc_weights: false
